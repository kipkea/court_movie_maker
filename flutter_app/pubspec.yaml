name: court_movie_maker
description: "Court Movie Maker - สร้างวิดีโอสำหรับสนามกีฬา"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  file_picker: ^8.1.2
  cached_network_image: ^3.3.1
  go_router: ^14.2.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.0
  path_provider: ^2.1.3
  open_file: ^3.3.2
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/